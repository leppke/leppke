name: Build Android APK

on:
  push:
    branches: [claude/stripe-transaction-queries-h3oqan]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A Gradle letöltések a services.gradle.org-ról GitHubra költöztek
      # (a régi cím átirányít, amin a wrapper-ellenőrzés elhasal) —
      # ezért közvetlenül az új címről töltünk.
      # Lásd: https://github.com/apache/cordova-android/issues/1863
      CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://github.com/gradle/gradle-distributions/releases/download/v8.14.2/gradle-8.14.2-bin.zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Build debug APK
        run: cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marina-kartyak-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Marina Kártyák APK (${{ github.run_number }}. build)
          body: Töltsd le az app-debug.apk fájlt, és nyisd meg a telefonon a telepítéshez.
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
