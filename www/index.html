<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Festipay POS — Neo-Brutalist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#FFFBE9; --paper:#FFFFFF; --ink:#0A0A0A; --ink-2:#1F1F1F; --ink-3:#525252; --ink-4:#737373;
  --pink:#FF2E93; --lime:#C6FF00; --blue:#2E5BFF; --yellow:#FFD60A; --orange:#FF6B00; --red:#FF1744;
  --green:#00C853;
  --shadow:6px 6px 0 #0A0A0A; --shadow-sm:3px 3px 0 #0A0A0A; --shadow-lg:8px 8px 0 #0A0A0A;
  --border:3px solid #0A0A0A; --border-thin:2px solid #0A0A0A;
  --display:'Archivo Black',Impact,sans-serif; --body:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;
  background-image:linear-gradient(45deg,transparent 49%,#0A0A0A08 49%,#0A0A0A08 51%,transparent 51%);background-size:24px 24px}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:-0.02em}
.num{font-family:var(--body);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--bg)}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;text-transform:uppercase;z-index:10}
.tb-left,.tb-right{display:flex;align-items:center;gap:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);border:2px solid var(--bg)}
#main-row{flex:1;display:flex;min-height:0;padding:8px;gap:8px}

#sidebar{width:230px;flex-shrink:0;display:flex;flex-direction:column;background:var(--paper);border:var(--border);box-shadow:var(--shadow)}
.brand{padding:18px 16px;border-bottom:var(--border);background:var(--yellow)}
.brand-name{display:flex;align-items:baseline;gap:0;line-height:1}
.brand-name-1{font-family:var(--display);font-size:28px;color:var(--ink)}
.brand-name-2{font-family:var(--display);font-size:30px;color:var(--pink);transform:rotate(-3deg);display:inline-block;text-shadow:2px 2px 0 var(--ink)}
.brand-env{margin-top:8px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;background:var(--ink);color:var(--bg);font-size:9px;font-weight:700;text-transform:uppercase}
#nav-scroll{flex:1;overflow-y:auto;padding:10px}
.nav-label{padding:0 6px 6px;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em}
.nav-label:not(:first-child){padding-top:14px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;background:transparent;border:2px solid transparent;color:var(--ink-2);font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:all 0.1s;text-transform:uppercase}
.nav-btn:hover:not(.active){background:var(--bg);border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.nav-btn.active{background:var(--pink);color:var(--paper);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.nav-btn .icon{flex-shrink:0}
.nav-btn-label{flex:1}
.nav-badge{background:var(--lime);color:var(--ink);font-size:10px;font-weight:700;padding:2px 6px;border:1.5px solid var(--ink);min-width:18px;text-align:center}
.nav-btn.active .nav-badge{background:var(--paper)}
#sidebar-bottom{padding:10px;border-top:var(--border)}
.user-card{padding:10px;background:var(--blue);border:var(--border-thin);display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--paper)}
.user-card:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.avatar{width:34px;height:34px;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:13px;border:var(--border-thin);flex-shrink:0}
.user-name{font-size:12px;font-weight:700;text-transform:uppercase}
.user-role{font-size:10px;opacity:0.8}

#cart{width:390px;flex-shrink:0;display:flex;flex-direction:column;background:var(--paper);border:var(--border);box-shadow:var(--shadow)}
.order-header{padding:14px 16px;border-bottom:var(--border);background:var(--lime);flex-shrink:0}
.order-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;border:var(--border-thin)}
.save-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;background:var(--paper);border:var(--border-thin);color:var(--ink);font-family:var(--body);font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase}
.save-btn:hover{background:var(--yellow);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.order-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
.table-info{display:flex;align-items:center;gap:10px}
.table-num{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;text-transform:uppercase}
.guest-counter{display:flex;align-items:center;background:var(--paper);border:var(--border-thin)}
.guest-btn-side{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer}
.guest-btn-side.minus{color:var(--red)}.guest-btn-side.plus{color:var(--green)}
.guest-btn-side:hover{background:var(--ink);color:var(--paper)}
.guest-count-val{min-width:36px;text-align:center;font-family:var(--display);font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;border-left:var(--border-thin);border-right:var(--border-thin)}
.brutto-display{text-align:right}
.brutto-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
.brutto-value{font-family:var(--display);font-size:28px;color:var(--ink);line-height:1;margin-top:2px}

.guest-selector{display:flex;gap:6px;padding:10px 12px;border-bottom:var(--border-thin);flex-shrink:0}
.guest-sel-btn{flex:1;padding:6px 4px;border:var(--border-thin);background:var(--paper);color:var(--ink);font-family:var(--body);font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase}
.guest-sel-btn:hover:not(.active){background:var(--yellow)}
.guest-sel-btn.active{background:var(--pink);color:var(--paper)}

#cart-items{flex:1;overflow-y:auto;padding:10px 12px}
.guest-section{margin-top:14px}
.guest-section:first-child{margin-top:4px}
.guest-header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 8px;border-bottom:2px dashed var(--ink);margin-bottom:8px}
.guest-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase}
.guest-num-badge{width:22px;height:22px;background:var(--blue);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;border:var(--border-thin)}
.guest-subtotal{font-family:var(--display);font-size:14px}

.cart-item{padding:10px;background:var(--bg);border:var(--border-thin);margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:transform 0.1s}
.cart-item:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink);background:var(--paper)}
.qty-control{display:flex;align-items:center;background:var(--paper);border:var(--border-thin);flex-shrink:0}
.qty-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--ink)}
.qty-btn:hover{background:var(--ink);color:var(--paper)}
.qty-btn.plus:hover{background:var(--green);color:var(--paper)}
.qty-value{min-width:24px;text-align:center;font-family:var(--display);font-size:13px;border-left:var(--border-thin);border-right:var(--border-thin)}
.item-info{flex:1;min-width:0}
.item-name{font-size:12px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.item-mods{margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.item-mod{font-size:10px;color:var(--pink);font-weight:700;text-transform:uppercase}
.item-status{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--paper);background:var(--orange);padding:2px 6px;border:1.5px solid var(--ink);font-weight:700;text-transform:uppercase}
.item-status .dot{width:5px;height:5px;border-radius:50%;background:var(--paper)}
.item-price{font-family:var(--display);font-size:14px;color:var(--ink);white-space:nowrap;flex-shrink:0}
.item-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}
.item-edit-btn{width:26px;height:26px;background:var(--paper);border:var(--border-thin);cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.item-edit-btn:hover{background:var(--yellow)}
.course-badge{min-width:26px;height:26px;padding:0 7px;background:var(--blue);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;border:var(--border-thin);cursor:pointer}
.course-badge.c2{background:var(--pink)}.course-badge.c3{background:var(--orange)}
.cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.cart-empty-icon{width:64px;height:64px;background:var(--yellow);border:var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.cart-empty-title{font-family:var(--display);font-size:18px}
.cart-empty-sub{font-size:11px;color:var(--ink-3);margin-top:4px;font-weight:600}

.cart-footer{border-top:var(--border);padding:12px;flex-shrink:0;background:var(--paper)}
#checkout-btn{width:100%;padding:16px;border:var(--border);background:var(--green);color:var(--paper);font-family:var(--display);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;box-shadow:var(--shadow-sm);transition:all 0.1s}
#checkout-btn:not(:disabled):hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--ink)}
#checkout-btn:disabled{background:var(--ink-4);color:var(--paper);cursor:not-allowed;opacity:0.5}

#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper);border:var(--border);box-shadow:var(--shadow)}
#toolbar{padding:12px 16px;border-bottom:var(--border);flex-shrink:0;background:var(--bg)}
.search-wrap{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px;background:var(--paper);border:var(--border-thin);margin-bottom:10px;cursor:text}
.search-wrap.focused{border:var(--border);box-shadow:var(--shadow-sm)}
.search-wrap input{flex:1;background:transparent;border:none;outline:none;font-family:var(--body);font-size:13px;color:var(--ink);font-weight:600}
.search-wrap input::placeholder{color:var(--ink-4)}
.search-clear{width:22px;height:22px;background:var(--ink);color:var(--paper);border:none;cursor:pointer;display:none;align-items:center;justify-content:center}
.search-clear.visible{display:flex}
.pills{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{display:flex;align-items:center;gap:5px;padding:0 12px;height:32px;background:var(--paper);border:var(--border-thin);color:var(--ink);font-family:var(--body);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;text-transform:uppercase}
.pill:hover:not(.active){background:var(--yellow);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.pill.active{background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.pill.active.accent{background:var(--pink);color:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.subpills{display:flex;align-items:center;gap:5px;overflow-x:auto;padding-bottom:2px;margin-top:8px}
.subpill{padding:0 10px;height:26px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);font-family:var(--body);font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;text-transform:uppercase}
.subpill:hover:not(.active){background:var(--lime)}
.subpill.active{background:var(--blue);color:var(--paper)}

#grid-area{flex:1;overflow-y:auto;padding:14px 16px}
.grid-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.result-count{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.result-count strong{color:var(--ink);font-family:var(--display);font-size:13px}

#product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.product-card{position:relative;padding:14px;background:var(--paper);border:var(--border-thin);cursor:pointer;display:flex;flex-direction:column;min-height:118px;transition:all 0.1s;text-align:left;font-family:var(--body)}
.product-card:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-sm);background:var(--yellow)}
.product-card:active{transform:translate(0,0);box-shadow:none}
.product-card.in-cart{background:var(--pink);color:var(--paper);border:var(--border)}
.product-card.in-cart:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-sm)}
.product-name{font-size:12px;font-weight:700;line-height:1.3;flex:1;text-transform:uppercase}
.product-price{font-family:var(--display);font-size:20px;margin-top:8px;line-height:1}
.product-stock{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.product-card.in-cart .product-stock{color:var(--paper);opacity:0.7}
.qty-badge{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 8px;background:var(--lime);color:var(--ink);font-family:var(--display);font-size:13px;display:flex;align-items:center;justify-content:center;border:var(--border-thin);box-shadow:3px 3px 0 var(--ink);transform:rotate(-6deg);animation:pop 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes pop{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(-6deg)}}

#keyboard{flex-shrink:0;background:var(--ink);border-top:var(--border);padding:8px;display:none}
#keyboard.visible{display:block;animation:slideUp 0.25s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.kb-row{display:flex;gap:4px;margin-bottom:4px;width:100%}
.kb-row:last-child{margin-bottom:0}
.kb-key{flex:1;min-width:0;height:42px;background:var(--paper);border:2px solid var(--ink);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.05s;padding:0;text-transform:lowercase}
.kb-key:hover{background:var(--yellow)}
.kb-key:active{background:var(--lime);transform:translateY(2px)}
.kb-key.mod{background:var(--ink-2);color:var(--paper);border-color:var(--ink-3);font-size:11px;text-transform:uppercase}
.kb-key.mod:hover{background:var(--pink)}
.kb-key.shift.active{background:var(--pink);color:var(--paper)}
.kb-key.wide-15{flex:1.5}.kb-key.space{flex:5}.kb-key.return{flex:1.5;background:var(--blue);color:var(--paper)}
.kb-key.return:hover{background:var(--pink)}
.kb-key.delete i{color:var(--red)}
.kb-row.specials .kb-key{background:var(--yellow)}
.kb-dismiss-bar{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 6px;color:var(--paper)}
.kb-dismiss-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--pink);color:var(--paper);border:1.5px solid var(--paper);font-family:var(--body);font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase}
.kb-hint{font-size:10px;color:var(--paper);display:flex;align-items:center;gap:5px;font-weight:600;text-transform:uppercase;opacity:0.7}

#footer{flex-shrink:0;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;border-top:var(--border);background:var(--yellow);color:var(--ink);font-size:10px;font-weight:700;text-transform:uppercase}
.footer-left{display:flex;align-items:center;gap:5px}
#no-results{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--ink-3);font-family:var(--display);font-size:18px}
</style>
</head>
<body>
<div id="app">
<header id="topbar">
<div class="tb-left"><span style="display:flex;align-items:center;gap:7px;"><span class="dot"></span>Online</span><span>Pénztár #04</span><span>Anna · műszak</span></div>
<div class="tb-right"><i data-lucide="bluetooth" style="width:13px;height:13px;"></i><i data-lucide="wifi" style="width:13px;height:13px;"></i><i data-lucide="battery-full" style="width:15px;height:15px;"></i><span>14:38</span></div>
</header>
<div id="main-row">

<nav id="sidebar">
<div class="brand"><div class="brand-name"><span class="brand-name-1">FESTI</span><span class="brand-name-2">PAY</span></div><div class="brand-env">★ TEST</div></div>
<div id="nav-scroll">
<div class="nav-label">Műveletek</div>
<button class="nav-btn active"><i data-lucide="shopping-cart" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Eladás</span></button>
<button class="nav-btn"><i data-lucide="clipboard-list" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Rendelések</span><span class="nav-badge">3</span></button>
<button class="nav-btn"><i data-lucide="package" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Termékek</span></button>
<button class="nav-btn"><i data-lucide="file-text" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Számlák</span></button>
<button class="nav-btn"><i data-lucide="arrow-down-to-line" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Bevételezés</span></button>
<button class="nav-btn"><i data-lucide="arrow-up-from-line" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Kiadás</span></button>
<button class="nav-btn"><i data-lucide="boxes" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Leltár</span></button>
<button class="nav-btn"><i data-lucide="rotate-ccw" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Visszáru</span></button>
<button class="nav-btn"><i data-lucide="gift" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Ajándék</span></button>
<div class="nav-label">Rendszer</div>
<button class="nav-btn"><i data-lucide="settings" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Beállítás</span></button>
<button class="nav-btn"><i data-lucide="layout-dashboard" class="icon" style="width:16px;height:16px;"></i><span class="nav-btn-label">Admin</span></button>
</div>
<div id="sidebar-bottom"><div class="user-card"><div class="avatar">NA</div><div style="flex:1;min-width:0;"><div class="user-name">Nagy Anna</div><div class="user-role">kezelő</div></div></div></div>
</nav>

<section id="cart">
<div class="order-header">
<div class="order-top-row"><span class="tag"><i data-lucide="utensils" style="width:11px;height:11px;"></i>Nyitott</span><button class="save-btn"><i data-lucide="bookmark" style="width:11px;height:11px;"></i>Mentés</button></div>
<div class="order-meta">
<div class="table-info">
<div class="table-num"><i data-lucide="armchair" style="width:13px;height:13px;"></i>Asztal 4</div>
<div class="guest-counter">
<button class="guest-btn-side minus" id="guest-minus"><i data-lucide="minus" style="width:11px;height:11px;"></i></button>
<span class="guest-count-val"><i data-lucide="users" style="width:11px;height:11px;"></i><span id="guest-count-val">2</span></span>
<button class="guest-btn-side plus" id="guest-plus"><i data-lucide="plus" style="width:11px;height:11px;"></i></button>
</div>
</div>
<div class="brutto-display"><div class="brutto-label">Bruttó</div><div class="brutto-value num" id="brutto-total">0 Ft</div></div>
</div>
</div>
<div class="guest-selector" id="guest-selector"></div>
<div id="cart-items"></div>
<div class="cart-footer"><button id="checkout-btn"><i data-lucide="check-circle" style="width:17px;height:17px;"></i>Fizetés Indítása</button></div>
</section>

<main id="main">
<div id="toolbar">
<div class="search-wrap" id="search-wrap">
<i data-lucide="search" style="width:15px;height:15px;color:var(--ink-3);"></i>
<input id="search-input" type="text" placeholder="Keresés..." readonly />
<button class="search-clear" id="search-clear"><i data-lucide="x" style="width:12px;height:12px;"></i></button>
</div>
<div class="pills" id="category-pills"></div>
<div class="subpills" id="subcategory-pills"></div>
</div>
<div id="grid-area"><div class="grid-header"><div class="result-count" id="result-count"></div></div><div id="product-grid"></div></div>
<div id="keyboard">
<div class="kb-dismiss-bar"><div class="kb-hint"><i data-lucide="keyboard" style="width:11px;height:11px;"></i>Magyar</div><button class="kb-dismiss-btn" id="kb-dismiss">Bezár <i data-lucide="chevron-down" style="width:10px;height:10px;"></i></button></div>
<div id="kb-rows"></div>
</div>
<footer id="footer"><div class="footer-left"><i data-lucide="info" style="width:11px;height:11px;"></i>Dev environment</div><div>v2.4.1</div></footer>
</main>

</div></div>

<script>
const PRODUCTS=[
{id:1,name:'Angol reggeli',price:3450,category:'Ételek',sub:'Reggeli'},{id:2,name:'Avokádó pirítóson',price:2950,category:'Ételek',sub:'Reggeli'},
{id:3,name:'Caesar saláta csirkével',price:2400,category:'Ételek',sub:'Saláták'},{id:4,name:'Cheeseburger',price:4250,category:'Ételek',sub:'Hamburger'},
{id:5,name:'Csirkemell rántva',price:3950,category:'Ételek',sub:'Főételek'},{id:6,name:'Csirkepaprikás galuskával',price:3200,category:'Ételek',sub:'Főételek'},
{id:7,name:'Cézár saláta csirkével',price:3450,category:'Ételek',sub:'Saláták'},{id:8,name:'Fagylalt (2 gombóc)',price:1250,category:'Ételek',sub:'Desszertek'},
{id:9,name:'Francia hagymaleves',price:1800,category:'Ételek',sub:'Levesek'},{id:10,name:'Gombaleves',price:1750,category:'Ételek',sub:'Levesek'},
{id:11,name:'Gombás rizottó',price:2600,category:'Ételek',sub:'Főételek'},{id:12,name:'Grillezett csirkemell',price:3400,category:'Ételek',sub:'Főételek'},
{id:13,name:'Grillzöldségek',price:1150,category:'Ételek',sub:'Köretek'},{id:14,name:'Gulyásleves',price:1800,category:'Ételek',sub:'Levesek'},
{id:15,name:'Gulyásleves (bográcsos)',price:1950,category:'Ételek',sub:'Levesek'},{id:16,name:'Gyümölcssaláta tejszínnel',price:1200,category:'Ételek',sub:'Desszertek'},
{id:17,name:'Görög saláta',price:2950,category:'Ételek',sub:'Saláták'},{id:18,name:'Halászlé',price:3800,category:'Ételek',sub:'Levesek'},
{id:19,name:'Halászlé (kicsi)',price:2450,category:'Ételek',sub:'Levesek'},{id:20,name:'Hamburger',price:3950,category:'Ételek',sub:'Hamburger'},
{id:21,name:'Hamburger (házi)',price:2900,category:'Ételek',sub:'Hamburger'},{id:22,name:'Hortobágyi palacsinta',price:2200,category:'Ételek',sub:'Főételek'},
{id:23,name:'Húsleves betéttel',price:1850,category:'Ételek',sub:'Levesek'},{id:24,name:'Marhapörkölt',price:3500,category:'Ételek',sub:'Főételek'},
{id:25,name:'Marhasteak (250g)',price:6950,category:'Ételek',sub:'Főételek'},{id:26,name:'Margherita pizza',price:2800,category:'Ételek',sub:'Pizza'},
{id:27,name:'Bolognai spagetti',price:2400,category:'Ételek',sub:'Tészták'},{id:28,name:'Sült burgonya',price:990,category:'Ételek',sub:'Köretek'},
{id:29,name:'Coca-Cola 0,33l',price:550,category:'Italok'},{id:30,name:'Americano',price:550,category:'Italok'},
];
const CATEGORIES=[{id:'Gyors',label:'Gyors',icon:'zap',accent:true},{id:'Alapanyag',label:'Alapanyag',icon:'layers'},{id:'Egyéb',label:'Egyéb',icon:'more-horizontal'},{id:'Italok',label:'Italok',icon:'wine'},{id:'Módosítók',label:'Módosítók',icon:'sparkles'},{id:'Ételek',label:'Ételek',icon:'utensils'}];
const SUBCATEGORIES=['Mind','Desszertek','Főételek','Hamburger','Köretek','Levesek','Pizza','Reggeli','Saláták','Tészták'];
const KEYBOARD_LAYOUT=[
{type:'row',cls:'numbers',keys:['1','2','3','4','5','6','7','8','9','0']},
{type:'row',keys:['q','w','e','r','t','y','u','i','o','p',{special:'delete',icon:'delete'}]},
{type:'row',keys:['a','s','d','f','g','h','j','k','l',{special:'return',label:'Enter',wide:'wide-15'}]},
{type:'row',keys:[{special:'shift',icon:'arrow-big-up',wide:'wide-15'},'z','x','c','v','b','n','m',',','.']},
{type:'row',cls:'specials',keys:['á','é','í','ó','ö','ő','ú','ü','ű']},
{type:'row',keys:[{special:'space',label:'szóköz',wide:'space'},'-','/']},
];
const S={category:'Ételek',subcategory:'Mind',search:'',guests:2,activeGuest:1,keyboardVisible:false,shift:false,cart:[
{uid:1,id:2,name:'Avokádó pirítóson',price:2950,qty:1,guest:1,course:1,notes:[{text:'Pirítós nélkül'}],status:'kitchen'},
{uid:2,id:7,name:'Caesar saláta csirkével',price:2400,qty:1,guest:1,course:2,notes:[],status:'kitchen'},
{uid:3,id:10,name:'Coca-Cola 0,33l',price:550,qty:1,guest:1,course:1,notes:[{text:'Jég nélkül'}],status:null},
{uid:4,id:8,name:'Cheeseburger',price:4250,qty:1,guest:1,course:2,notes:[{text:'Jól átsütve'}],status:'kitchen'},
{uid:5,id:13,name:'Grillzöldségek',price:1150,qty:1,guest:1,course:2,notes:[],status:'kitchen'},
{uid:6,id:10,name:'Coca-Cola 0,33l',price:550,qty:2,guest:2,course:1,notes:[{text:'Extra citrom'}],status:null},
{uid:7,id:14,name:'Gulyásleves',price:1800,qty:1,guest:2,course:2,notes:[{text:'Csípős'}],status:'kitchen'},
{uid:8,id:2,name:'Avokádó pirítóson',price:2950,qty:1,guest:2,course:1,notes:[],status:'kitchen'},
]};
const fmt=n=>new Intl.NumberFormat('hu-HU').format(n)+' Ft';
const itemTotal=i=>(i.price+(i.notes||[]).reduce((s,n)=>s+(n.price||0),0))*i.qty;
const romanize=n=>['','I','II','III','IV','V'][n]||n;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function addProduct(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;const e=S.cart.find(x=>x.id===id&&x.guest===S.activeGuest&&(!x.notes||!x.notes.length));if(e)e.qty++;else{const uid=Math.max(0,...S.cart.map(x=>x.uid))+1;S.cart.push({uid,id:p.id,name:p.name,price:p.price,qty:1,guest:S.activeGuest,course:1,notes:[]})}renderCart();renderGrid()}
function changeQty(uid,d){const i=S.cart.find(x=>x.uid===uid);if(!i)return;i.qty+=d;if(i.qty<=0)S.cart=S.cart.filter(x=>x.uid!==uid);renderCart();renderGrid()}
function changeGuestCount(d){S.guests=Math.max(0,Math.min(20,S.guests+d));$('guest-count-val').textContent=S.guests===0?'—':S.guests;if(S.activeGuest>S.guests)S.activeGuest=Math.max(1,S.guests);renderGuestSelector()}
function renderGuestSelector(){const el=$('guest-selector');if(S.guests===0){el.innerHTML='';return}el.innerHTML=Array.from({length:S.guests},(_,i)=>i+1).map(g=>`<button class="guest-sel-btn${g===S.activeGuest?' active':''}" data-gsel="${g}">${g}. vendég</button>`).join('')}
function renderKeyboard(){$('kb-rows').innerHTML=KEYBOARD_LAYOUT.map(row=>{const rc=['kb-row',row.cls||''].filter(Boolean).join(' ');return `<div class="${rc}">${row.keys.map(k=>{if(typeof k==='string'){const d=S.shift?k.toUpperCase():k;return `<button class="kb-key" data-char="${k}">${d}</button>`}const w=k.wide?' '+k.wide:'';const sa=k.special==='shift'&&S.shift?' active':'';return `<button class="kb-key mod ${k.special}${w}${sa}" data-special="${k.special}">${k.icon?`<i data-lucide="${k.icon}" style="width:16px;height:16px;"></i>`:k.label}</button>`}).join('')}</div>`}).join('');lucide.createIcons()}
function showKeyboard(){if(S.keyboardVisible)return;S.keyboardVisible=true;$('keyboard').classList.add('visible');$('search-wrap').classList.add('focused')}
function hideKeyboard(){if(!S.keyboardVisible)return;S.keyboardVisible=false;$('keyboard').classList.remove('visible');$('search-wrap').classList.remove('focused')}
function handleKeyPress(k){if(k==='shift'){S.shift=!S.shift;renderKeyboard();return}if(k==='delete'){S.search=S.search.slice(0,-1)}else if(k==='return'){hideKeyboard();return}else if(k==='space'){S.search+=' '}else{S.search+=S.shift?k.toUpperCase():k;if(S.shift){S.shift=false;renderKeyboard()}}$('search-input').value=S.search;$('search-clear').classList.toggle('visible',!!S.search);renderGrid()}
function renderCategories(){$('category-pills').innerHTML=CATEGORIES.map(c=>{const a=S.category===c.id;return `<button class="pill${a?' active':''}${a&&c.accent?' accent':''}" data-cat="${c.id}"><i data-lucide="${c.icon}" style="width:13px;height:13px;"></i>${c.label}</button>`}).join('');lucide.createIcons()}
function renderSubcategories(){if(S.category!=='Ételek'){$('subcategory-pills').innerHTML='';return}$('subcategory-pills').innerHTML=SUBCATEGORIES.map(sc=>`<button class="subpill${S.subcategory===sc?' active':''}" data-sub="${sc}">${sc}</button>`).join('')}
function renderGrid(){const list=PRODUCTS.filter(p=>{const oc=S.category==='Gyors'||p.category===S.category;const os=S.category!=='Ételek'||S.subcategory==='Mind'||p.sub===S.subcategory;const oq=!S.search||p.name.toLowerCase().includes(S.search.toLowerCase());return oc&&os&&oq});$('result-count').innerHTML=`<strong>${list.length}</strong> termék${S.search?` — „${esc(S.search)}"`:''}`;if(!list.length){$('product-grid').innerHTML=`<div id="no-results">Nincs találat</div>`;return}$('product-grid').innerHTML=list.map(p=>{const ic=S.cart.find(x=>x.id===p.id);return `<button class="product-card${ic?' in-cart':''}" data-pid="${p.id}">${ic?`<div class="qty-badge">${ic.qty}</div>`:''}<div class="product-name">${esc(p.name)}</div><div class="product-price num">${fmt(p.price)}</div><div class="product-stock">—</div></button>`}).join('')}
function renderCart(){const total=S.cart.reduce((s,i)=>s+itemTotal(i),0);$('brutto-total').textContent=fmt(total);$('checkout-btn').disabled=!S.cart.length;if(!S.cart.length){$('cart-items').innerHTML=`<div class="cart-empty"><div class="cart-empty-icon"><i data-lucide="shopping-bag" style="width:28px;height:28px;"></i></div><div class="cart-empty-title">Üres!</div><div class="cart-empty-sub">Válassz terméket →</div></div>`;lucide.createIcons();return}const bg={};S.cart.forEach(i=>{(bg[i.guest]||(bg[i.guest]=[])).push(i)});let html='';Object.keys(bg).sort((a,b)=>+a-+b).forEach(g=>{const items=bg[g];const sub=items.reduce((s,i)=>s+itemTotal(i),0);html+=`<div class="guest-section"><div class="guest-header"><div class="guest-label"><span class="guest-num-badge">${g}</span>${g}. vendég</div><div class="guest-subtotal num">${fmt(sub)}</div></div>`;items.forEach(item=>{const mh=(item.notes||[]).map(n=>n.price?`<span class="item-mod">${esc(n.text)} +${fmt(n.price)}</span>`:`<span class="item-mod">${esc(n.text)}</span>`).join('');const sh=item.status==='kitchen'?`<span class="item-status"><span class="dot"></span>Konyhán</span>`:'';const ms=(mh||sh)?`<div class="item-mods">${sh}${mh}</div>`:'';html+=`<div class="cart-item"><div class="qty-control"><button class="qty-btn" data-quid="${item.uid}" data-d="-1"><i data-lucide="minus" style="width:11px;height:11px;"></i></button><span class="qty-value">${item.qty}</span><button class="qty-btn plus" data-quid="${item.uid}" data-d="1"><i data-lucide="plus" style="width:11px;height:11px;"></i></button></div><div class="item-info"><div class="item-name">${esc(item.name)}</div>${ms}</div><div class="item-price num">${fmt(itemTotal(item))}</div><div class="item-actions"><button class="item-edit-btn"><i data-lucide="pencil" style="width:11px;height:11px;"></i></button><div class="course-badge ${item.course===2?'c2':item.course===3?'c3':''}" data-cuid="${item.uid}">${romanize(item.course)}</div></div></div>`});html+=`</div>`});$('cart-items').innerHTML=html;lucide.createIcons()}

document.addEventListener('click',e=>{
const ch=e.target.closest('[data-char]');if(ch){handleKeyPress(ch.dataset.char);return}
const sk=e.target.closest('[data-special]');if(sk){handleKeyPress(sk.dataset.special);return}
if(e.target.closest('#kb-dismiss')){hideKeyboard();return}
if(e.target.closest('#search-wrap')&&!e.target.closest('#search-clear')){showKeyboard();return}
if(e.target.closest('#search-clear')){S.search='';$('search-input').value='';$('search-clear').classList.remove('visible');renderGrid();return}
const c=e.target.closest('[data-pid]');if(c){addProduct(+c.dataset.pid);hideKeyboard();return}
const q=e.target.closest('[data-quid]');if(q){changeQty(+q.dataset.quid,+q.dataset.d);return}
const cb=e.target.closest('[data-cat]');if(cb){S.category=cb.dataset.cat;S.subcategory='Mind';renderCategories();renderSubcategories();renderGrid();return}
const sb=e.target.closest('[data-sub]');if(sb){S.subcategory=sb.dataset.sub;renderSubcategories();renderGrid();return}
if(e.target.closest('#guest-minus')){changeGuestCount(-1);return}
if(e.target.closest('#guest-plus')){changeGuestCount(1);return}
const gs=e.target.closest('[data-gsel]');if(gs){S.activeGuest=+gs.dataset.gsel;renderGuestSelector();return}
const cu=e.target.closest('[data-cuid]');if(cu){const i=S.cart.find(x=>x.uid===+cu.dataset.cuid);if(i){i.course=(i.course%3)+1;renderCart()}return}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();showKeyboard()}if(e.key==='Escape')hideKeyboard()});
renderCategories();renderSubcategories();renderGrid();renderCart();renderGuestSelector();renderKeyboard();lucide.createIcons();
</script>
</body></html>
